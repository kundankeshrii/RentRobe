spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rentrobeDB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  admin:
    email: ${ADMIN_EMAIL:admin@rentrobe.com}
    password: ${ADMIN_PASSWORD:admin123}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:rentrobe-super-secret-key-change-in-production-at-least-256-bits}
  expiration: 86400000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
  api-key: ${CLOUDINARY_API_KEY:your-api-key}
  api-secret: ${CLOUDINARY_API_SECRET:your-api-secret}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}

logging:
  level:
    com.rentrobe: INFO
    org.springframework.security: WARN
